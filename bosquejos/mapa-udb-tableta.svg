<svg xmlns="http://www.w3.org/2000/svg" width="834" height="1112" viewBox="0 0 834 1112">
  <title>Bosquejo del mapa interactivo UDB para tableta</title>
  <desc>Interfaz de tableta con navegación compacta, búsqueda, categorías horizontales, mapa del campus y ficha inferior.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#122150" flood-opacity="0.18"/></filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#d9e1ee"/></pattern>
  </defs>
  <rect width="834" height="1112" fill="#ebeff9"/>

  <g id="encabezado">
    <rect width="834" height="76" fill="#274292"/>
    <rect x="24" y="14" width="48" height="48" rx="11" fill="#ffe000"/>
    <text x="48" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#274292">UDB</text>
    <text x="88" y="36" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Mapa interactivo UDB</text>
    <text x="88" y="55" font-family="Arial, sans-serif" font-size="12" fill="#cbd7f5">Encuentra tu destino en el campus</text>
    <rect x="744" y="19" width="54" height="38" rx="10" fill="#35529f"/>
    <path d="M760 30h22M760 38h22M760 46h22" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="busqueda-y-filtros">
    <rect x="24" y="96" width="786" height="58" rx="14" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="53" cy="125" r="9" fill="none" stroke="#274292" stroke-width="2"/>
    <path d="M60 132l7 7" stroke="#274292" stroke-width="2" stroke-linecap="round"/>
    <text x="82" y="131" font-family="Arial, sans-serif" font-size="15" fill="#7a8496">Buscar un edificio, servicio o espacio...</text>
    <rect x="690" y="106" width="106" height="38" rx="10" fill="#274292"/>
    <text x="743" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">BUSCAR</text>

    <g font-family="Arial, sans-serif" font-size="13" font-weight="700">
      <rect x="24" y="174" width="82" height="38" rx="19" fill="#274292"/><text x="65" y="198" text-anchor="middle" fill="#ffffff">Todos</text>
      <rect x="116" y="174" width="105" height="38" rx="19" fill="#ffffff"/><text x="168" y="198" text-anchor="middle" fill="#274292">Edificios</text>
      <rect x="231" y="174" width="126" height="38" rx="19" fill="#ffffff"/><text x="294" y="198" text-anchor="middle" fill="#274292">Laboratorios</text>
      <rect x="367" y="174" width="112" height="38" rx="19" fill="#ffffff"/><text x="423" y="198" text-anchor="middle" fill="#274292">Cafeterías</text>
      <rect x="489" y="174" width="82" height="38" rx="19" fill="#ffffff"/><text x="530" y="198" text-anchor="middle" fill="#274292">Baños</text>
      <rect x="581" y="174" width="101" height="38" rx="19" fill="#ffffff"/><text x="631" y="198" text-anchor="middle" fill="#274292">Parqueos</text>
      <rect x="692" y="174" width="118" height="38" rx="19" fill="#2face3"/><text x="751" y="198" text-anchor="middle" fill="#ffffff">Mi ubicación</text>
    </g>
  </g>

  <g id="mapa">
    <rect x="24" y="234" width="786" height="688" rx="18" fill="#f8fafc" filter="url(#shadow)"/>
    <rect x="24" y="234" width="786" height="688" rx="18" fill="url(#grid)"/>
    <path d="M42 802C165 704 250 738 365 640S584 553 792 578" fill="none" stroke="#ffffff" stroke-width="48"/>
    <path d="M42 802C165 704 250 738 365 640S584 553 792 578" fill="none" stroke="#c4cedc" stroke-width="3" stroke-dasharray="10 8"/>
    <path d="M314 250C326 390 302 508 365 640" fill="none" stroke="#ffffff" stroke-width="40"/>
    <path d="M314 250C326 390 302 508 365 640" fill="none" stroke="#c4cedc" stroke-width="3" stroke-dasharray="9 8"/>
    <path d="M650 252C600 390 608 504 622 564" fill="none" stroke="#ffffff" stroke-width="38"/>

    <g fill="#dcefdc"><rect x="52" y="268" width="194" height="150" rx="18"/><rect x="620" y="687" width="160" height="186" rx="18"/></g>
    <g fill="#d9e4f5" stroke="#8fa5c7" stroke-width="2">
      <rect x="72" y="298" width="145" height="82" rx="7"/>
      <rect x="392" y="276" width="176" height="98" rx="7"/>
      <rect x="385" y="430" width="166" height="102" rx="7"/>
      <rect x="637" y="353" width="128" height="88" rx="7"/>
      <rect x="74" y="521" width="180" height="94" rx="7"/>
      <rect x="398" y="742" width="180" height="94" rx="7"/>
    </g>
    <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#536480" text-anchor="middle">
      <text x="145" y="345">Edificio 1</text><text x="480" y="330">Biblioteca</text><text x="468" y="488">Laboratorios</text>
      <text x="701" y="403">Cafetería</text><text x="164" y="574">Edificio 2</text><text x="488" y="796">Cómputo</text>
    </g>

    <g transform="translate(480 285)">
      <path d="M0 0c-15 0-27 12-27 27 0 21 27 49 27 49s27-28 27-49C27 12 15 0 0 0z" fill="#274292"/>
      <circle cy="27" r="10" fill="#ffffff"/><text y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#274292">B</text>
    </g>
    <g transform="translate(701 353)"><path d="M0 0c-12 0-22 10-22 22 0 17 22 39 22 39s22-22 22-39C22 10 12 0 0 0z" fill="#ffe000"/><circle cy="22" r="8" fill="#ffffff"/></g>

    <g filter="url(#shadow)">
      <rect x="742" y="258" width="48" height="100" rx="12" fill="#ffffff"/>
      <text x="766" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#274292">+</text>
      <line x1="752" y1="308" x2="780" y2="308" stroke="#dbe2ee"/>
      <text x="766" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#274292">−</text>
    </g>
  </g>

  <g id="ficha-inferior" filter="url(#shadow)">
    <rect x="54" y="850" width="726" height="200" rx="20" fill="#ffffff"/>
    <rect x="54" y="850" width="726" height="9" rx="4" fill="#274292"/>
    <circle cx="101" cy="910" r="27" fill="#eef4ff"/>
    <text x="101" y="918" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#274292">B</text>
    <text x="145" y="901" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#21315f">Biblioteca Rafael Meza Ayau</text>
    <text x="145" y="928" font-family="Arial, sans-serif" font-size="13" fill="#667085">Consulta de libros, áreas de estudio y recursos digitales.</text>
    <text x="145" y="955" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#274292">Abierto · 7:00 a. m. – 7:00 p. m.</text>
    <rect x="145" y="978" width="174" height="46" rx="11" fill="#274292"/>
    <text x="232" y="1006" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Ver indicaciones</text>
    <rect x="331" y="978" width="174" height="46" rx="11" fill="#eef4ff"/>
    <text x="418" y="1006" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#274292">Más información</text>
    <text x="742" y="885" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#667085">×</text>
  </g>

  <text x="417" y="1092" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#67758e">Bosquejo de tableta · 834 × 1112 px</text>
</svg>
