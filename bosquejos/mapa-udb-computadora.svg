<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>Bosquejo del mapa interactivo UDB para computadora</title>
  <desc>Interfaz de escritorio con encabezado institucional, panel lateral de búsqueda y filtros, mapa del campus y ficha de un edificio.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#122150" flood-opacity="0.18"/>
    </filter>
    <pattern id="map-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d9e1ee" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1440" height="900" fill="#ebeff9"/>

  <!-- Encabezado -->
  <g id="encabezado">
    <rect width="1440" height="88" fill="#274292"/>
    <rect x="32" y="20" width="52" height="52" rx="12" fill="#ffe000"/>
    <text x="58" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#274292">UDB</text>
    <text x="100" y="43" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Universidad Don Bosco</text>
    <text x="100" y="64" font-family="Arial, sans-serif" font-size="13" fill="#cbd7f5">Mapa interactivo del campus</text>

    <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      <text x="800" y="53">MAPA</text>
      <text x="880" y="53">CÓMO USARLO</text>
      <text x="1030" y="53">ACCESIBILIDAD</text>
      <text x="1190" y="53">ACERCA DE</text>
    </g>
    <rect x="1320" y="24" width="88" height="40" rx="20" fill="#ffe000"/>
    <text x="1364" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#274292">AYUDA</text>
  </g>

  <!-- Panel lateral -->
  <g id="panel-lateral">
    <rect x="24" y="112" width="328" height="736" rx="18" fill="#ffffff" filter="url(#shadow)"/>
    <text x="48" y="154" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#21315f">¿A dónde deseas ir?</text>
    <text x="48" y="181" font-family="Arial, sans-serif" font-size="14" fill="#667085">Busca un edificio, servicio o espacio.</text>

    <rect x="48" y="204" width="280" height="50" rx="10" fill="#f7f9fd" stroke="#b9c6dc"/>
    <circle cx="71" cy="229" r="8" fill="none" stroke="#274292" stroke-width="2"/>
    <path d="M77 235l7 7" stroke="#274292" stroke-width="2" stroke-linecap="round"/>
    <text x="94" y="235" font-family="Arial, sans-serif" font-size="14" fill="#7a8496">Buscar un lugar...</text>

    <text x="48" y="294" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#21315f">Filtrar por categoría</text>
    <g font-family="Arial, sans-serif" font-size="14">
      <rect x="48" y="314" width="128" height="40" rx="20" fill="#274292"/>
      <text x="112" y="339" text-anchor="middle" fill="#ffffff">Todos</text>
      <rect x="184" y="314" width="144" height="40" rx="20" fill="#eef4ff"/>
      <text x="256" y="339" text-anchor="middle" fill="#274292">Edificios</text>
      <rect x="48" y="364" width="128" height="40" rx="20" fill="#eef4ff"/>
      <text x="112" y="389" text-anchor="middle" fill="#274292">Laboratorios</text>
      <rect x="184" y="364" width="144" height="40" rx="20" fill="#eef4ff"/>
      <text x="256" y="389" text-anchor="middle" fill="#274292">Cafeterías</text>
      <rect x="48" y="414" width="128" height="40" rx="20" fill="#eef4ff"/>
      <text x="112" y="439" text-anchor="middle" fill="#274292">Baños</text>
      <rect x="184" y="414" width="144" height="40" rx="20" fill="#eef4ff"/>
      <text x="256" y="439" text-anchor="middle" fill="#274292">Parqueos</text>
    </g>

    <line x1="48" y1="480" x2="328" y2="480" stroke="#dbe2ee"/>
    <text x="48" y="517" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#21315f">Lugares destacados</text>
    <g font-family="Arial, sans-serif">
      <circle cx="70" cy="552" r="18" fill="#dff4ff"/>
      <text x="70" y="558" text-anchor="middle" font-size="17" fill="#1976d2">B</text>
      <text x="101" y="549" font-size="14" font-weight="700" fill="#28354f">Biblioteca</text>
      <text x="101" y="569" font-size="12" fill="#768197">Recursos académicos</text>

      <circle cx="70" cy="611" r="18" fill="#fff4c4"/>
      <text x="70" y="617" text-anchor="middle" font-size="17" fill="#8a6a00">C</text>
      <text x="101" y="608" font-size="14" font-weight="700" fill="#28354f">Cafetería</text>
      <text x="101" y="628" font-size="12" fill="#768197">Alimentos y bebidas</text>

      <circle cx="70" cy="670" r="18" fill="#e7e3ff"/>
      <text x="70" y="676" text-anchor="middle" font-size="17" fill="#5b45b0">L</text>
      <text x="101" y="667" font-size="14" font-weight="700" fill="#28354f">Laboratorios</text>
      <text x="101" y="687" font-size="12" fill="#768197">Áreas especializadas</text>
    </g>

    <rect x="48" y="744" width="280" height="52" rx="12" fill="#2face3"/>
    <circle cx="73" cy="770" r="8" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="73" cy="770" r="2" fill="#ffffff"/>
    <text x="94" y="776" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Usar mi ubicación</text>
  </g>

  <!-- Mapa -->
  <g id="mapa">
    <rect x="376" y="112" width="1040" height="736" rx="18" fill="#f8fafc" filter="url(#shadow)"/>
    <rect x="376" y="112" width="1040" height="736" rx="18" fill="url(#map-grid)"/>

    <!-- Caminos -->
    <path d="M402 718C540 642 610 686 748 593S1025 506 1394 542" fill="none" stroke="#ffffff" stroke-width="52"/>
    <path d="M402 718C540 642 610 686 748 593S1025 506 1394 542" fill="none" stroke="#c4cedc" stroke-width="3" stroke-dasharray="10 9"/>
    <path d="M700 140C718 302 692 406 748 593" fill="none" stroke="#ffffff" stroke-width="42"/>
    <path d="M700 140C718 302 692 406 748 593" fill="none" stroke="#c4cedc" stroke-width="3" stroke-dasharray="9 8"/>
    <path d="M1100 140C1040 270 1044 414 1068 525" fill="none" stroke="#ffffff" stroke-width="38"/>
    <path d="M1100 140C1040 270 1044 414 1068 525" fill="none" stroke="#c4cedc" stroke-width="3" stroke-dasharray="9 8"/>

    <!-- Áreas verdes -->
    <path d="M425 155h220v188H425z" rx="20" fill="#dcefdc"/>
    <path d="M1160 604h214v190h-214z" fill="#dcefdc"/>
    <circle cx="1205" cy="690" r="48" fill="#c5e5c8"/>
    <circle cx="1298" cy="742" r="34" fill="#c5e5c8"/>

    <!-- Edificios -->
    <g fill="#d9e4f5" stroke="#8fa5c7" stroke-width="2">
      <rect x="455" y="188" width="156" height="95" rx="8"/>
      <rect x="783" y="164" width="206" height="112" rx="8"/>
      <rect x="790" y="330" width="180" height="118" rx="8"/>
      <rect x="1122" y="242" width="210" height="110" rx="8"/>
      <rect x="1138" y="390" width="184" height="90" rx="8"/>
      <rect x="454" y="494" width="214" height="108" rx="8"/>
      <rect x="838" y="662" width="225" height="103" rx="8"/>
    </g>
    <g font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#536480" text-anchor="middle">
      <text x="533" y="241">Edificio 1</text>
      <text x="886" y="224">Biblioteca</text>
      <text x="880" y="393">Laboratorios</text>
      <text x="1227" y="302">Edificio 3</text>
      <text x="1230" y="445">Cafetería</text>
      <text x="561" y="554">Edificio 2</text>
      <text x="950" y="720">Centro de Cómputo</text>
    </g>

    <!-- Marcadores -->
    <g id="marcadores" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <g transform="translate(886 175)">
        <path d="M0 0c-15 0-27 12-27 27 0 21 27 48 27 48s27-27 27-48C27 12 15 0 0 0z" fill="#274292"/>
        <circle cy="27" r="10" fill="#ffffff"/><text y="32" fill="#274292">B</text>
      </g>
      <g transform="translate(1230 365)">
        <path d="M0 0c-13 0-23 10-23 23 0 18 23 41 23 41s23-23 23-41C23 10 13 0 0 0z" fill="#ffe000"/>
        <circle cy="23" r="9" fill="#ffffff"/><text y="28" fill="#8a6a00">C</text>
      </g>
      <g transform="translate(560 468)">
        <path d="M0 0c-13 0-23 10-23 23 0 18 23 41 23 41s23-23 23-41C23 10 13 0 0 0z" fill="#2face3"/>
        <circle cy="23" r="9" fill="#ffffff"/><text y="28" fill="#1976d2">2</text>
      </g>
    </g>

    <!-- Ficha del lugar -->
    <g id="ficha-lugar" filter="url(#shadow)">
      <rect x="1020" y="608" width="342" height="190" rx="16" fill="#ffffff"/>
      <rect x="1020" y="608" width="342" height="10" rx="5" fill="#274292"/>
      <text x="1044" y="654" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#21315f">Biblioteca Rafael Meza Ayau</text>
      <text x="1044" y="681" font-family="Arial, sans-serif" font-size="13" fill="#667085">Consulta de libros, estudio y recursos digitales.</text>
      <text x="1044" y="709" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#274292">Abierto · 7:00 a. m. – 7:00 p. m.</text>
      <rect x="1044" y="733" width="132" height="42" rx="10" fill="#274292"/>
      <text x="1110" y="759" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Ver indicaciones</text>
      <rect x="1186" y="733" width="142" height="42" rx="10" fill="#eef4ff"/>
      <text x="1257" y="759" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#274292">Más información</text>
    </g>

    <!-- Controles -->
    <g id="controles-mapa" filter="url(#shadow)">
      <rect x="1336" y="138" width="52" height="108" rx="12" fill="#ffffff"/>
      <text x="1362" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#274292">+</text>
      <line x1="1348" y1="192" x2="1376" y2="192" stroke="#dbe2ee"/>
      <text x="1362" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#274292">−</text>
    </g>

    <rect x="400" y="792" width="258" height="36" rx="18" fill="#ffffff" opacity="0.94"/>
    <circle cx="421" cy="810" r="5" fill="#274292"/>
    <text x="437" y="815" font-family="Arial, sans-serif" font-size="12" fill="#536480">Entrada principal</text>
    <circle cx="538" cy="810" r="5" fill="#2face3"/>
    <text x="554" y="815" font-family="Arial, sans-serif" font-size="12" fill="#536480">Servicios</text>
  </g>

  <text x="720" y="880" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#67758e">Bosquejo de computadora · 1440 × 900 px</text>
</svg>
